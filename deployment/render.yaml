# Deploy only after the owner has created/approved the cloud accounts.
# The source repository root is the Docker build context.
services:
  - type: web
    name: tamaya-members-api
    runtime: docker
    # Preparation/testing plan. Review always-on hosting before store operation.
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: FIREBASE_PROJECT_ID
        value: tamayaapp
      - key: DATABASE_URL
        sync: false
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: DATABASE_CA_PATH
        value: /etc/secrets/supabase-ca.crt
# Verify Render uses exactly one trusted reverse-proxy hop before enabling TRUST_PROXY_HOPS=1.
# Add firebase-admin.json and the official supabase-ca.crt using Render Secret Files.
# Keep the Firebase private key out of GitHub.
# PUBLIC_BASE_URL uses Render's built-in RENDER_EXTERNAL_URL by default.
# Add CORS_ORIGINS only when hosting a browser app; native iPhone requests do not need it.
# Free is for initial validation; the owner chooses any paid plan separately.
# This file creates no service or contract itself.
