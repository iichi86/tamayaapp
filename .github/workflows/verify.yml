name: Verify application and management API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tamaya_check
          POSTGRES_PASSWORD: local-validation-only
          POSTGRES_DB: tamaya_check
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tamaya_check" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix server ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test
        env:
          TEST_DATABASE_URL: postgres://tamaya_check:local-validation-only@127.0.0.1:5432/tamaya_check
      - run: npm --prefix server run build
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            tools/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix server ci --no-audit --no-fund
      - run: npm --prefix tools ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-results
          path: |
            playwright-report-production
            test-results/production
            docs/screenshots/production
